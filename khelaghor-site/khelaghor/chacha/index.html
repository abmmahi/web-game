<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2f6f5e;overflow:hidden;touch-action:none;font-family:'Hind Siliguri',system-ui,sans-serif;color:#fff8e7;-webkit-user-select:none;user-select:none}

button:focus-visible{outline:3px solid #fff;outline-offset:3px}

<body>
<a class="home" href="/">← হোম</a>
<canvas id="c"></canvas>
<div class="screen" id="start">
  <h1>চাচার প্রশ্ন!</h1>
  <p>"বিয়ে কবে?" "রেজাল্ট কী?" "চাকরি হয়েছে?" — প্রশ্ন এড়িয়ে চলো।</p>
  <p>স্ক্রিনের বাঁ বা ডান পাশে ট্যাপ করো। বিরিয়ানি খেলে অস্বস্তি কমে।</p>
  <button id="go">শুরু করো</button>
</div>
<div class="screen hide" id="over">
  <h1 id="ot">লজ্জায় বাথরুমে লুকালে 🚪</h1>
  <p id="os"></p>
  <div class="row"><button id="again">আবার</button><button class="alt" id="share">শেয়ার করো</button></div>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,gw,gx,laneW;
function resize(){
  const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  gw=Math.min(W,460);gx=(W-gw)/2;laneW=gw/3;
}
addEventListener('resize',resize);resize();
const LX=i=>gx+laneW*(i+.5);
const F='"Hind Siliguri",sans-serif';

let ac;
function tone(f,d,type='square',v=.05,delay=0){
  if(!ac)return;try{
    const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+delay;
    o.type=type;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);
    o.connect(g).connect(ac.destination);o.start(s);o.stop(s+d);
  }catch(e){}
}
const sfxHit=()=>{tone(180,.18,'sawtooth',.07);tone(120,.25,'sawtooth',.07,.08)};
const sfxEat=()=>{tone(660,.08,'triangle',.06);tone(990,.12,'triangle',.06,.08)};
const sfxMove=()=>tone(440,.04,'triangle',.02);

const Q=['বিয়ে কবে?','রেজাল্ট কী?','চাকরি হয়েছে?','বেতন কত?','মোটা হয়েছ!','বন্ধু তো বিদেশ গেল','কবে সেটেল হবে?','পাত্রী দেখি?','এত রোগা কেন?','আর কত পড়বে?','ফেসবুকে কী করো?','লেখাপড়া কেমন?'];
const HIT=['আহা! 😬','ইশ!','উফ…','কী বলি এখন'];
const REL=['👴','👵','🧔'];

let st='menu',t=0,aw=0,score=0,dodged=0,items=[],spawnT=1,lane=1,px=0,shake=0,flash=0,pops=[],talk=[0,0,0],dist=0,speed=0,best=0;
try{best=+localStorage.getItem('chacha_best')||0}catch(e){}
const py=()=>H-110;

function wrap(text,maxW){
  ctx.font='700 16px '+F;const w=text.split(' '),lines=[];let cur='';
  w.forEach(x=>{const n=cur?cur+' '+x:x;if(ctx.measureText(n).width>maxW&&cur){lines.push(cur);cur=x}else cur=n});
  lines.push(cur);return lines;
}
function spawn(){
  const ls=[0,1,2].sort(()=>Math.random()-.5),n=(t>8&&Math.random()<.28)?2:1;
  for(let k=0;k<n;k++){
    const l=ls[k],b=(n===1&&Math.random()<.14);
    const text=Q[Math.floor(Math.random()*Q.length)];
    items.push({lane:l,y:-50,type:b?'b':'q',lines:b?null:wrap(text,laneW*.9-16)});
    talk[l]=.35;
  }
}
function start(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(ac&&ac.state==='suspended')ac.resume();
  st='play';t=0;aw=0;score=0;dodged=0;items=[];spawnT=.8;lane=1;px=LX(1);pops=[];shake=0;flash=0;
  document.getElementById('start').classList.add('hide');document.getElementById('over').classList.add('hide');
}
function end(){
  st='over';
  if(score>best){best=score;try{localStorage.setItem('chacha_best',best)}catch(e){}}
  const r=score<50?'নতুন জামাই/কনে':score<150?'মোটামুটি সামলাচ্ছ':score<300?'প্রশ্ন-নিনজা':'চাচাও হার মানল';
  document.getElementById('os').textContent='স্কোর '+score+' · সেরা '+best+' · '+dodged+'টা প্রশ্ন এড়ালে · '+r;
  setTimeout(()=>document.getElementById('over').classList.remove('hide'),600);
}
document.getElementById('go').onclick=start;
document.getElementById('again').onclick=start;
document.getElementById('share').onclick=async function(){
  const txt='চাচার প্রশ্ন গেমে '+score+' পয়েন্ট পেলাম, '+dodged+'টা প্রশ্ন এড়ালাম! তুমি পারবে? '+location.href;
  try{if(navigator.share){await navigator.share({text:txt});return}}catch(e){}
  try{await navigator.clipboard.writeText(txt);this.textContent='কপি হয়েছে ✓'}catch(e){this.textContent='শেয়ার সম্ভব হলো না'}
};

function move(d){if(st!=='play')return;const n=Math.max(0,Math.min(2,lane+d));if(n!==lane){lane=n;sfxMove()}}
cv.addEventListener('pointerdown',e=>move(e.clientX<W/2?-1:1));
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')move(-1);
  if(e.key==='ArrowRight'||e.key==='d')move(1);
  if((e.key==='Enter'||e.key===' ')&&st!=='play'&&document.activeElement===document.body)start();
});

function pop(x,y,text,col){pops.push({x,y,text,col,life:1})}
function update(dt){
  t+=dt;speed=Math.min(240+t*7,640)*H/800;dist+=speed*dt;
  spawnT-=dt;
  if(spawnT<=0){spawnT=Math.max(.38,1.05-t*.011)*(.8+Math.random()*.4);spawn()}
  px+=(LX(lane)-px)*Math.min(dt*18,1);
  items.forEach(it=>{
    it.y+=speed*dt;
    if(!it.done&&Math.abs(it.y-py())<36&&Math.abs(LX(it.lane)-px)<laneW*.42){
      it.done=true;
      if(it.type==='q'){aw+=26;shake=.3;flash=.25;sfxHit();pop(px,py()-60,HIT[Math.floor(Math.random()*HIT.length)],'#ff5a4d')}
      else{aw=Math.max(0,aw-28);score+=5;sfxEat();pop(px,py()-60,'-অস্বস্তি 🍛','#ffd23f')}
    }
    if(it.y>H+70&&!it.done&&it.type==='q'){dodged++;score+=10}
  });
  items=items.filter(it=>!it.done&&it.y<H+70);
  aw+=dt*1.2;
  for(let i=0;i<3;i++)talk[i]=Math.max(0,talk[i]-dt);
  shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);
  pops.forEach(p=>{p.life-=dt*1.1;p.y-=dt*50});pops=pops.filter(p=>p.life>0);
  if(aw>=100){aw=100;end()}
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*10,(Math.random()-.5)*10);
  // floor tiles
  const ts=64,off=dist%(ts*2);
  ctx.fillStyle='#f0d29a';ctx.fillRect(0,0,W,H);
  for(let r=-2;r<H/ts+2;r++)for(let c=0;c<W/ts+1;c++){
    if((r+c)%2===0){ctx.fillStyle='#e6bf7e';ctx.fillRect(c*ts,r*ts+off%ts-ts+(Math.floor(off/ts)%2?ts:0),ts,ts)}
  }
  // lane dividers
  ctx.strokeStyle='rgba(90,50,20,.25)';ctx.lineWidth=2;ctx.setLineDash([10,12]);
  for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(gx+laneW*i,100);ctx.lineTo(gx+laneW*i,H);ctx.stroke()}
  ctx.setLineDash([]);
  // wall + relatives
  ctx.fillStyle='#2f6f5e';ctx.fillRect(0,0,W,96);ctx.fillStyle='#244f43';ctx.fillRect(0,92,W,6);
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<3;i++){
    const s=48+(talk[i]>0?talk[i]*40:0);ctx.font=s+'px sans-serif';ctx.fillText(REL[i],LX(i),62);
  }
  // items
  items.forEach(it=>{
    const x=LX(it.lane);
    if(it.type==='b'){ctx.font='54px sans-serif';ctx.fillText('🍛',x,it.y);return}
    const n=it.lines.length,w=laneW*.9,h=24+n*20,bx=x-w/2,by=it.y-h/2;
    ctx.fillStyle='#fffdf5';ctx.strokeStyle='#b3261e';ctx.lineWidth=3;
    rr(bx,by,w,h,12);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-8,by+h-1);ctx.lineTo(x,by+h+10);ctx.lineTo(x+8,by+h-1);ctx.fillStyle='#fffdf5';ctx.fill();
    ctx.fillStyle='#2b1a12';ctx.font='700 16px '+F;
    it.lines.forEach((l,i)=>ctx.fillText(l,x,by+h/2+(i-(n-1)/2)*20));
  });
  // player
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(px,py()+34,28,8,0,0,6.283);ctx.fill();
  const face=aw<25?'🙂':aw<50?'😐':aw<75?'😬':'😰';
  ctx.font='60px sans-serif';ctx.fillText(face,px,py()+Math.sin(t*10)*2);
  // pops
  pops.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.font='700 22px '+F;ctx.lineWidth=5;ctx.strokeStyle='#2b1a12';ctx.strokeText(p.text,p.x,p.y);ctx.fillStyle=p.col;ctx.fillText(p.text,p.x,p.y);ctx.globalAlpha=1});
  // HUD
  ctx.textAlign='left';ctx.font='700 18px '+F;ctx.fillStyle='#fff8e7';ctx.fillText('অস্বস্তি',gx+10,118);
  ctx.fillStyle='rgba(0,0,0,.4)';rr(gx+84,108,gw-94,20,10);ctx.fill();
  ctx.fillStyle=aw>70?'#ff5a4d':aw>40?'#ffb347':'#7ddc7a';rr(gx+84,108,Math.max(8,(gw-94)*Math.min(aw,100)/100),20,10);ctx.fill();
  ctx.textAlign='right';ctx.font='700 20px '+F;ctx.lineWidth=4;ctx.strokeStyle='#2b1a12';
  ctx.strokeText('স্কোর '+score,gx+gw-10,150);ctx.fillStyle='#fff8e7';ctx.fillText('স্কোর '+score,gx+gw-10,150);
  if(flash>0){ctx.fillStyle='rgba(255,60,40,'+flash*1.2+')';ctx.fillRect(0,0,W,H)}
  ctx.restore();
}
let last=performance.now();
function loop(n){
  const dt=Math.min((n-last)/1000,.05);last=n;
  if(st==='play')update(dt);else{dist+=120*dt;px+=(LX(lane)-px)*.2;t+=dt}
  draw();requestAnimationFrame(loop);
}
px=LX(1);requestAnimationFrame(loop);
})();
</script>
</body>
